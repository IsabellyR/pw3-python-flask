{% extends 'index.html' %}

{% block content %}
<h1>Decks em destaque</h1>
<hr>

<table>
    <tr>
        <th>Nome</th>
        <th>Card</th>
        <th>Preço</th>
        <th>Tier</th>
    </tr>

    {% for deck in lista_decks %}
    <tr>
        <td>{{ deck.nome }}</td>
        <td>{{ deck.card }}</td>
        <td>{{ deck.preco }}</td>
        <td>{{ deck.tier }}</td>
    </tr>
    {% endfor %}
</table>

<a href="/">Voltar</a>
{% endblock %}
