{% extends 'index.html' %}

{% block content %}
<h2>Cadastro de Decks</h2>
<hr>

<form action="{{ url_for('cad') }}" method="POST">
    <label>Nome</label>
    <input type="text" name="nome" placeholder="Insira o nome do deck" class="form-control" required>

    <label>Card Principal</label>
    <input type="text" name="card" placeholder="Insira o card principal do deck" class="form-control" required>

    <label>Preço</label>
    <input type="text" name="preco" placeholder="Insira o preço do deck" class="form-control" required>
     <label>Tier</label>
    <input type="text" name="tier" placeholder="Insira o tier do deck" class="form-control" required>

    <br>
    <input type="submit" value="Cadastrar" class="btn btn-success">
    <input type="reset" value="Limpar" class="btn btn-danger">
</form>

<br>
<hr>

<h4>Decks Cadastrados:</h4>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>Nome</th>
            <th>Card</th>
            <th>Preço</th>
            <th>Tier</th>
        </tr>
    </thead>
    <tbody>
        {% for deck in lista_decks %}
        <tr>
            <td>{{ deck.nome }}</td>
            <td>{{ deck.card }}</td>
            <td>{{ deck.preco }}</td>
            <td>{{ deck.tier }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock content %}
