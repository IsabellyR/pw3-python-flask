<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh Duel Links</title>
    <style>
        body {
    margin: 0;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0a0f1f, #111a33, #0d1b2a);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


form {
    background: rgba(10, 25, 50, 0.95);
    padding: 35px;
    width: 340px;
    border-radius: 10px;
    border: 2px solid #00aaff;
    box-shadow: 0 0 25px #0077ff;
    position: relative;
}


form::before {
    content: "KAIBA CORPORATION - SYSTEM REGISTER";
    display: block;
    text-align: center;
    color: #00ccff;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 25px;
    letter-spacing: 1px;
}


label {
    color: #cce6ff;
    font-size: 13px;
    letter-spacing: 1px;
}


input {
    width: 100%;
    padding: 10px;
    margin: 6px 0 18px 0;
    background: #0f2747;
    border: 1px solid #0088ff;
    border-radius: 5px;
    color: #e6f7ff;
    outline: none;
    transition: 0.3s;
}


input:focus {
    border: 1px solid #00e1ff;
    box-shadow: 0 0 10px #00e1ff;
    background: #12335c;
}


button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background: linear-gradient(90deg, #005bea, #00c6fb);
    color: white;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
}


button:hover {
    background: linear-gradient(90deg, #003c99, #0099cc);
    box-shadow: 0 0 15px #00ccff;
    transform: scale(1.03);
}
    </style>
</head>
<body>
        <form>
        <label>Nome:</label>
        <br>
        <input>
        <br>
        <label>Card Principal:</label>
        <br>
        <input>
        <br>
        <label>Preço:</label>
        <br>
        <input>
        <br>
         <label>Tier:</label>
         <br>
        <input>
        <br>
        <button>Cadastrar</button>
    </form>
</body>
</html>
