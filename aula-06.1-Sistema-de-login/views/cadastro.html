{% extends 'base.html' %}
{% block content %}
<!--Buscando e exibindo as flash messages-->
{% with messages = get_flashed_messages(with_categories=true) %}

{% for category, message in messages %}
    <div class="alert alert-{{ category }}">
        {{ message }}

    </div>
{% endfor %}
{% endwith %}
    <!-- Formulário de Cadastro -->
     <div class="container">
       <div class="card mt-4">
        <div class="card-header">
            <h2>Cadastro de Usuário</h2>
        </div>
        <div class="card-body">
            <!--Formulário-->
            <form action="{{url_for('cadastro')}}" method="POST">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="Insira seu e-mail">
                <label>Senha</label>
                <input type="password" name="senha" placeholder="Insira sua senha">
                <button type="submit" class="btn btn-danger btn-block">Cadastrar</button>

            </form>
        </div>
       </div>
     </div>
{% endblock content %}
